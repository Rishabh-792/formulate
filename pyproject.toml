[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formulate"
version = "0.1.0"
description = "AI-assisted optimization modeling: plain English -> typed spec -> Pyomo -> solved and explained"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Rishabh Maheshwari" }]
keywords = ["optimization", "linear-programming", "pyomo", "operations-research", "llm"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyomo>=6.7",
    "highspy>=1.7",
]

[project.optional-dependencies]
# The engine core is solver-only; the service, UI, and Azure paths are extras.
api = ["fastapi>=0.111", "uvicorn>=0.30"]
ui = ["streamlit>=1.35"]
azure = ["openai>=3.1.0"]

[project.urls]
Homepage = "https://github.com/Rishabh-792/formulate"
Source = "https://github.com/Rishabh-792/formulate"

[tool.setuptools]
packages = ["formulate"]

[tool.setuptools.package-data]
# The bundled specs and prompts are not optional extras: the keyless mock
# interpreter loads a spec from examples/ and the Azure path loads its system
# prompts from prompts/. Ship them or `pip install formulate` raises
# FileNotFoundError on the first call.
formulate = ["py.typed", "examples/*.json", "examples/*.md", "prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
