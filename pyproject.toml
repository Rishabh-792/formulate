[project]
name = "formulate"
version = "0.1.0"
description = "AI-assisted optimization modeling: plain English -> typed spec -> Pyomo -> solved and explained"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
